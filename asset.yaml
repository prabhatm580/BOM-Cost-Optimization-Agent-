apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: bom-cost-optimization-agent
  version: "2.4.0"
  description: "AI agent for cross-plant BOM cost analysis, Make/Buy/Strategic Buy classification, and workflow triggering. v2.4.0: Enhanced sentiment, BOM reverse lookup, 95% efficiency, beautiful UI"

type: agent

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
